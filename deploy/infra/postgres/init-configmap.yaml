apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: rutadeorigen
data:
  01-traceability.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v pw="$TRACEABILITY_DB_PASSWORD" <<'EOSQL'
    CREATE ROLE traceability LOGIN PASSWORD :'pw';
    CREATE DATABASE traceability_db OWNER traceability;
    REVOKE ALL ON DATABASE traceability_db FROM PUBLIC;
    EOSQL