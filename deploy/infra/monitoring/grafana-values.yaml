admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

service:
  type: NodePort
  nodePort: 30300

grafana.ini:
  server:
    root_url: https://homeserver.tailf2a613.ts.net:3000

persistence:
  enabled: true
  size: 2Gi

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy