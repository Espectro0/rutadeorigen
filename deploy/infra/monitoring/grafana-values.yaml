admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

service:
  type: NodePort
  nodePort: 30300

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.rutadeorigen.internal

grafana.ini:
  server:
    root_url: http://grafana.rutadeorigen.internal

persistence:
  enabled: true
  size: 2Gi

deploymentStrategy:
  type: Recreate

livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 600
  timeoutSeconds: 30
  failureThreshold: 10

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 60
  timeoutSeconds: 30

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy