apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-reader
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-reader-monitoring-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao-reader
    namespace: monitoring
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: monitoring
spec:
  provider:
    vault:
      server: "https://openbao.rutadeorigen.internal:8200"
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "monitoring"
          serviceAccountRef:
            name: openbao-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana
        property: admin-password