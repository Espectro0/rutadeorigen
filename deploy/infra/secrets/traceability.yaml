apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: rutadeorigen
spec:
  provider:
    vault:
      server: "https://openbao.rutadeorigen.internal:8200"
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "traceability"
          serviceAccountRef:
            name: openbao-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traceability-db
  namespace: rutadeorigen
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: traceability-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: traceability/database
        property: DATABASE_URL
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: traceability/rabbitmq
        property: RABBITMQ_URL
    - secretKey: WORKOS_API_KEY
      remoteRef:
        key: OIDC
        property: WORKOS_API_KEY
    - secretKey: WORKOS_CLIENT_ID
      remoteRef:
        key: OIDC
        property: WORKOS_CLIENT_ID
    - secretKey: WORKOS_COOKIE_PASSWORD
      remoteRef:
        key: OIDC
        property: WORKOS_COOKIE_PASSWORD
    - secretKey: WORKOS_REDIRECT_URI
      remoteRef:
        key: OIDC
        property: WORKOS_REDIRECT_URI
    - secretKey: AUTH_MODE
      remoteRef:
        key: OIDC
        property: AUTH_MODE
    - secretKey: AUTH_SUCCESS_URL
      remoteRef:
        key: OIDC
        property: AUTH_SUCCESS_URL
    - secretKey: AUTH_FAILURE_URL
      remoteRef:
        key: OIDC
        property: AUTH_FAILURE_URL
    - secretKey: AUTH_LOGOUT_URL
      remoteRef:
        key: OIDC
        property: AUTH_LOGOUT_URL
    - secretKey: COOKIE_SECURE
      remoteRef:
        key: OIDC
        property: COOKIE_SECURE
    - secretKey: COOKIE_DOMAIN
      remoteRef:
        key: OIDC
        property: COOKIE_DOMAIN
    - secretKey: WORKOS_ISSUER
      remoteRef:
        key: OIDC
        property: WORKOS_ISSUER
    - secretKey: GARAGE_ENDPOINT
      remoteRef:
        key: Garage
        property: GARAGE_ENDPOINT
    - secretKey: GARAGE_PUBLIC_URL
      remoteRef:
        key: Garage
        property: GARAGE_PUBLIC_URL
    - secretKey: GARAGE_REGION
      remoteRef:
        key: Garage
        property: GARAGE_REGION
    - secretKey: GARAGE_QUARANTINE_BUCKET
      remoteRef:
        key: Garage
        property: GARAGE_QUARANTINE_BUCKET
    - secretKey: GARAGE_USE_SSL
      remoteRef:
        key: Garage
        property: GARAGE_USE_SSL
    - secretKey: EVIDENCE_MAX_BYTES
      remoteRef:
        key: Garage
        property: EVIDENCE_MAX_BYTES
    - secretKey: EVIDENCE_UPLOAD_TTL
      remoteRef:
        key: Garage
        property: EVIDENCE_UPLOAD_TTL
    - secretKey: GARAGE_ACCESS_KEY
      remoteRef:
        key: traceability/garage
        property: GARAGE_ACCESS_KEY
    - secretKey: GARAGE_SECRET_KEY
      remoteRef:
        key: traceability/garage
        property: GARAGE_SECRET_KEY
