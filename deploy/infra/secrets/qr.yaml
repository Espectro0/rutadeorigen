apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-qr
  namespace: rutadeorigen
spec:
  provider:
    vault:
      server: "https://openbao.rutadeorigen.internal:8200"
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "qr"
          serviceAccountRef:
            name: openbao-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qr-db
  namespace: rutadeorigen
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-qr
    kind: SecretStore
  target:
    name: qr-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: qr/database
        property: DATABASE_URL
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: qr/rabbitmq
        property: RABBITMQ_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: qr/redis
        property: REDIS_URL