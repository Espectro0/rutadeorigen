apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-qr
  namespace: rutadeorigen
spec:
  provider:
    vault:
      server: "https://openbao.rutadeorigen.internal:8200"
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "qr"
          serviceAccountRef:
            name: openbao-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qr-db
  namespace: rutadeorigen
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-qr
    kind: SecretStore
  target:
    name: qr-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: qr/database
        property: DATABASE_URL
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: qr/rabbitmq
        property: RABBITMQ_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: qr/redis
        property: REDIS_URL
    - secretKey: PUBLIC_BASE_URL
      remoteRef:
        key: qr/config
        property: PUBLIC_BASE_URL
    - secretKey: QR_CACHE_TTL
      remoteRef:
        key: qr/config
        property: QR_CACHE_TTL
    - secretKey: WORKOS_API_KEY
      remoteRef:
        key: OIDC
        property: WORKOS_API_KEY
    - secretKey: WORKOS_CLIENT_ID
      remoteRef:
        key: OIDC
        property: WORKOS_CLIENT_ID
    - secretKey: WORKOS_COOKIE_PASSWORD
      remoteRef:
        key: OIDC
        property: WORKOS_COOKIE_PASSWORD
    - secretKey: WORKOS_REDIRECT_URI
      remoteRef:
        key: OIDC
        property: WORKOS_REDIRECT_URI