apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-cloudflared
  namespace: rutadeorigen
spec:
  provider:
    vault:
      server: "https://openbao.rutadeorigen.internal:8200"
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "cloudflared"
          serviceAccountRef:
            name: openbao-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: rutadeorigen
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cloudflared
    kind: SecretStore
  target:
    name: cloudflared-token
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: cloudflare/tunnel
        property: TUNNEL_TOKEN
