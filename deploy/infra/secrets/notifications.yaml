apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-notifications
  namespace: rutadeorigen
spec:
  provider:
    vault:
      server: "https://openbao.rutadeorigen.internal:8200"
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "notifications"
          serviceAccountRef:
            name: openbao-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notifications-db
  namespace: rutadeorigen
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-notifications
    kind: SecretStore
  target:
    name: notifications-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: notifications/database
        property: DATABASE_URL
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: notifications/rabbitmq
        property: RABBITMQ_URL
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: notifications/resend
        property: RESEND_API_KEY
    - secretKey: RESEND_FROM
      remoteRef:
        key: notifications/resend
        property: RESEND_FROM
    - secretKey: PUBLIC_BASE_URL
      remoteRef:
        key: notifications/config
        property: PUBLIC_BASE_URL
