apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-processor
  namespace: rutadeorigen
spec:
  provider:
    vault:
      server: "https://openbao.rutadeorigen.internal:8200"
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "processor"
          serviceAccountRef:
            name: openbao-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: processor-db
  namespace: rutadeorigen
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-processor
    kind: SecretStore
  target:
    name: processor-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: processor/database
        property: DATABASE_URL
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: processor/rabbitmq
        property: RABBITMQ_URL
    - secretKey: GARAGE_ENDPOINT
      remoteRef:
        key: Garage
        property: GARAGE_ENDPOINT
    - secretKey: GARAGE_REGION
      remoteRef:
        key: Garage
        property: GARAGE_REGION
    - secretKey: GARAGE_QUARANTINE_BUCKET
      remoteRef:
        key: Garage
        property: GARAGE_QUARANTINE_BUCKET
    - secretKey: GARAGE_USE_SSL
      remoteRef:
        key: Garage
        property: GARAGE_USE_SSL
    - secretKey: EVIDENCE_MAX_BYTES
      remoteRef:
        key: Garage
        property: EVIDENCE_MAX_BYTES
    - secretKey: GARAGE_ACCESS_KEY
      remoteRef:
        key: processor/garage
        property: GARAGE_ACCESS_KEY
    - secretKey: GARAGE_SECRET_KEY
      remoteRef:
        key: processor/garage
        property: GARAGE_SECRET_KEY
