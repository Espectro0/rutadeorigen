image:
  repository: ghcr.io/espectro0/rutadeorigen
  pullPolicy: IfNotPresent

port: 8080

logLevel: info

terminationGracePeriodSeconds: 20

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 15
  liveness:
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    failureThreshold: 2
    timeoutSeconds: 3

resources:
  requests:
    cpu: 100m
    memory: 32Mi
  limits:
    memory: 128Mi

ingress:
  enabled: true
  host: test.rutadeorigen.co
  entryPoint: web
  rateLimit:
    enabled: true
    sourceHeader: Cf-Connecting-Ip
    average: 20
    burst: 40
    auth:
      enabled: true
      service: traceability
      path: /auth/
      average: 5
      burst: 10

services: {}