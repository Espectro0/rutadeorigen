{{- range $name, $svc := .Values.services }}
  {{- if and $svc.autoscaling $svc.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $svc.autoscaling.min | default 1 }}
  maxReplicas: {{ $svc.autoscaling.max | default 5 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.cpu | default 70 }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
  {{- end }}
  {{- end }}