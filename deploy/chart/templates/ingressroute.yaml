{{- if .Values.ingress.enabled }}
{{- $rl := .Values.ingress.rateLimit }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rutadeorigen
  labels:
    app.kubernetes.io/name: rutadeorigen
    app.kubernetes.io/part-of: rutadeorigen
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  routes:
    {{- if and $rl.enabled $rl.auth.enabled }}
    - kind: Rule
      priority: 1000
      match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`{{ $rl.auth.path }}`)
      middlewares:
        - name: rate-limit-auth
      services:
        - name: {{ $rl.auth.service }}
          port: 80
    {{- end }}
    {{- range $name, $svc := .Values.services }}
    {{- $limited := true }}
    {{- if hasKey $svc "rateLimit" }}{{- $limited = $svc.rateLimit }}{{- end }}
    {{- if $svc.paths }}
    - kind: Rule
      match: Host(`{{ $.Values.ingress.host }}`) && ({{ range $i, $path := $svc.paths }}{{ if $i }} || {{ end }}PathPrefix(`{{ $path }}`){{ end }})
      {{- if and $rl.enabled $limited }}
      middlewares:
        - name: rate-limit
      {{- end }}
      services:
        - name: {{ $name }}
          port: 80
    {{- end }}
    {{- if $svc.apiPaths }}
    - kind: Rule
      match: Host(`{{ $.Values.ingress.host }}`) && ({{ range $i, $path := $svc.apiPaths }}{{ if $i }} || {{ end }}PathPrefix(`{{ $path }}`){{ end }})
      middlewares:
        - name: strip-api
        {{- if and $rl.enabled $limited }}
        - name: rate-limit
        {{- end }}
      services:
        - name: {{ $name }}
          port: 80
    {{- end }}
    {{- end }}
{{- end }}
