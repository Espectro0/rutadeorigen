{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rutadeorigen
  labels:
    app.kubernetes.io/name: rutadeorigen
    app.kubernetes.io/part-of: rutadeorigen
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  routes:
    {{- range $name, $svc := .Values.services }}
    {{- if $svc.paths }}
    - kind: Rule
      match: Host(`{{ $.Values.ingress.host }}`) && ({{ range $i, $path := $svc.paths }}{{ if $i }} || {{ end }}PathPrefix(`{{ $path }}`){{ end }})
      services:
        - name: {{ $name }}
          port: 80
    {{- end }}
    {{- end }}
{{- end }}
