[request_definition]
r = sub, obj, act

[policy_definition]
p = role, res, act, stage, rel

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (p.role == "*" || r.sub.Role == p.role) && r.obj.Type == p.res && r.act == p.act && (p.stage == "*" || r.obj.Stage == p.stage) && (p.rel == "any" || (p.rel == "owner" && r.sub.ID != "" && r.sub.ID == r.obj.OwnerID) || (p.rel == "custodian" && r.sub.ID != "" && r.sub.ID == r.obj.CustodianID))
