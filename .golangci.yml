version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gosec      # seguridad del código (SAST)
    - revive     # buenas prácticas y estilo de Go
    - errorlint  # manejo correcto de errores envueltos
    - bodyclose  # respuestas HTTP sin cerrar
    - gocyclo    # funciones demasiado complejas
  settings:
    gocyclo:
      min-complexity: 15
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - rutadeorigen