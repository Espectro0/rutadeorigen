name: notifications

on:
  pull_request:
    paths:
      - "services/notifications/**"
      - ".github/workflows/_go-service.yml"
      - ".golangci.yml"
      - "go.work"
      - "lib/**"
      - ".dockerignore"
  push:
    branches: [main]
    paths:
      - "services/notifications/**"
      - ".github/workflows/_go-service.yml"
      - ".golangci.yml"
      - "go.work"
      - "lib/**"
      - ".dockerignore"

jobs:
  ci:
    name: notifications
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_go-service.yml
    with:
      service: notifications
      build-image: true
    secrets: inherit