name: go-service

on:
  workflow_call:
    inputs:
      service:
        description: Carpeta del servicio dentro de services/
        required: true
        type: string
      build-image:
        description: Construir y escanear la imagen Docker
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  quality:
    name: CI · Calidad (${{ inputs.service }})
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: services/${{ inputs.service }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: services/${{ inputs.service }}/go.mod
          cache-dependency-path: services/${{ inputs.service }}/go.sum

      - name: Formato, análisis estático y seguridad
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
          working-directory: services/${{ inputs.service }}

      - name: Reglas de arquitectura
        run: |
          go install github.com/fe3dback/go-arch-lint@latest
          go-arch-lint check

      - name: Tests y cobertura
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Vulnerabilidades de dependencias
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: services/${{ inputs.service }}

  image:
    name: CI · Imagen (${{ inputs.service }})
    needs: quality
    if: inputs.build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v7.0.1

      - name: Construir imagen
        run: docker build -f services/${{ inputs.service }}/Dockerfile -t ${{ inputs.service }}:${{ github.sha }} .

      - name: Escanear imagen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Guardar imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o /tmp/imagen.tar "$IMAGE:${{ github.sha }}"

      - name: Subir imagen como artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: imagen-${{ inputs.service }}
          path: /tmp/imagen.tar
          retention-days: 1

  publish:
    name: CD · Publicar (${{ inputs.service }})
    needs: image
    if: inputs.build-image && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Descargar imagen
        uses: actions/download-artifact@v8
        with:
          name: imagen-${{ inputs.service }}
          path: /tmp

      - name: Cargar imagen
        run: docker load -i /tmp/imagen.tar

      - name: Login en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen
        run: docker push "$IMAGE:${{ github.sha }}"